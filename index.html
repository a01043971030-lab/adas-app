<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>모바일 스마트폰 100% 최적화 ADAS & 블랙박스</title>
    <!-- Leaflet.js 모바일 실시간 지도 엔진 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            position: fixed;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .mobile-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #000;
        }

        /* 가로모드 OLED/레티나 폰 화면 100% 캔버스 */
        canvas {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        /* 미니멀 상단 HUD 바 */
        .top-hud {
            position: absolute;
            top: env(safe-area-inset-top, 8px);
            left: 0;
            width: 100%;
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0) 100%);
            z-index: 20;
            pointer-events: none;
        }

        .hud-left {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .rec-pill {
            background-color: rgba(239, 68, 68, 0.95);
            color: white;
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.7rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
        }

        .adas-status {
            background-color: rgba(34, 197, 94, 0.3);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.7);
            padding: 4px 10px;
            border-radius: 16px;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .cam-alert-pill {
            background-color: rgba(234, 179, 8, 0.25);
            color: #fde047;
            border: 1px solid rgba(234, 179, 8, 0.6);
            padding: 4px 8px;
            border-radius: 16px;
            font-size: 0.68rem;
            font-weight: bold;
        }

        .speed-display {
            font-size: 2rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -1px;
            text-shadow: 0 0 14px rgba(59, 130, 246, 0.9);
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .speed-unit {
            font-size: 0.75rem;
            font-weight: normal;
            color: #94a3b8;
        }

        .traffic-badge {
            background-color: rgba(15, 23, 42, 0.95);
            border: 1.5px solid #3b82f6;
            padding: 6px 12px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.88rem;
            font-weight: 900;
            backdrop-filter: blur(10px);
        }

        .light-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #475569;
        }

        .light-dot.red { background-color: #ef4444; box-shadow: 0 0 14px #ef4444; }
        .light-dot.green { background-color: #22c55e; box-shadow: 0 0 14px #22c55e; }

        /* 🗺️ 모바일 턴바이턴 배너 */
        .navi-turn-banner {
            position: absolute;
            top: 55px;
            left: 16px;
            background-color: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            border-radius: 16px;
            padding: 10px 16px;
            display: none;
            align-items: center;
            gap: 12px;
            z-index: 25;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }

        .turn-icon {
            font-size: 2.2rem;
            color: #38bdf8;
            font-weight: 900;
        }

        .turn-info {
            display: flex;
            flex-direction: column;
        }

        .turn-dist {
            font-size: 1.5rem;
            font-weight: 900;
            color: #38bdf8;
        }

        .turn-text {
            font-size: 0.85rem;
            color: #f8fafc;
            font-weight: 700;
        }

        /* 🗺️ 우측 상단 실시간 모바일 GPS 미니맵 */
        .navi-minimap-container {
            position: absolute;
            top: 55px;
            right: 16px;
            width: 180px;
            height: 180px;
            border-radius: 16px;
            border: 2px solid #0284c7;
            overflow: hidden;
            z-index: 25;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            display: none;
        }

        #naviMap {
            width: 100%;
            height: 100%;
        }

        /* 단속 카메라 알림 배너 */
        .camera-pop-banner {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 1.05rem;
            font-weight: 900;
            z-index: 36;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none;
            backdrop-filter: blur(10px);
            animation: popIn 0.3s ease-out;
            text-align: center;
            white-space: nowrap;
            background-color: rgba(234, 179, 8, 0.95);
            color: #000;
            border: 2px solid #fde047;
        }

        /* 신호 변경 대형 팝업 배너 */
        .signal-pop-banner {
            position: absolute;
            top: 115px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: 900;
            z-index: 35;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none;
            backdrop-filter: blur(10px);
            animation: popIn 0.3s ease-out;
            text-align: center;
            white-space: nowrap;
        }

        @keyframes popIn {
            from { transform: translateX(-50%) scale(0.7); opacity: 0; }
            to { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        /* 경보 발생 시 화면 중앙 팝업 */
        .alert-banner {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 900;
            display: none;
            z-index: 30;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            text-align: center;
            width: 85%;
            max-width: 450px;
            backdrop-filter: blur(10px);
        }

        .alert-banner.critical {
            background-color: rgba(220, 38, 38, 0.95);
            color: #ffffff;
            display: block;
            border: 2px solid #f87171;
            animation: flash 0.3s infinite alternate;
        }

        @keyframes flash {
            from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            to { opacity: 0.85; transform: translate(-50%, -50%) scale(1.03); }
        }

        /* 🚨 0.1초 삐뽀삐뽀 비상 경고등 레이어 */
        .siren-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99;
            display: none;
            box-shadow: inset 0 0 120px rgba(239, 68, 68, 0.95);
            border: 24px solid rgba(239, 68, 68, 0.95);
            animation: sirenFlash 0.15s infinite alternate;
        }

        @keyframes sirenFlash {
            from {
                background-color: rgba(239, 68, 68, 0.45);
                box-shadow: inset 0 0 140px rgba(255, 0, 0, 0.95);
                border-color: rgba(239, 68, 68, 0.95);
            }
            to {
                background-color: rgba(185, 28, 28, 0.12);
                box-shadow: inset 0 0 40px rgba(220, 38, 38, 0.4);
                border-color: rgba(185, 28, 28, 0.4);
            }
        }

        /* 📱 모바일 최적화 드래그 메뉴 바 */
        .compact-menu-bar {
            position: absolute;
            bottom: env(safe-area-inset-bottom, 12px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 5px;
            z-index: 50;
            background-color: rgba(15, 23, 42, 0.94);
            padding: 6px 10px;
            border-radius: 22px;
            backdrop-filter: blur(14px);
            border: 1.5px solid rgba(59, 130, 246, 0.6);
            box-shadow: 0 6px 20px rgba(0,0,0,0.8);
            white-space: nowrap;
        }

        .drag-handle {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(255,255,255,0.18);
            color: #38bdf8;
            padding: 6px 10px;
            border-radius: 14px;
            font-size: 0.72rem;
            font-weight: bold;
            cursor: grab;
            touch-action: none;
            min-height: 36px;
        }

        .mini-btn {
            background-color: rgba(255,255,255,0.15);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 16px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s;
            touch-action: manipulation;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mini-btn:active {
            transform: scale(0.92);
            background-color: rgba(255,255,255,0.35);
        }

        .power-btn-off {
            background-color: #22c55e;
            color: #ffffff;
            font-weight: 900;
            box-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
        }

        .power-btn-on {
            background-color: #ef4444;
            color: #ffffff;
            font-weight: 900;
            box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
            animation: pulse 1.5s infinite;
        }

        .navi-btn-off {
            background-color: #475569;
            color: #cbd5e1;
        }

        .navi-btn-on {
            background-color: #0284c7;
            color: #ffffff;
            font-weight: 900;
            box-shadow: 0 0 8px rgba(2, 132, 199, 0.6);
        }

        .play-btn { background-color: #ec4899; }
        .hide-btn { background-color: #475569; }

        /* 모바일 모달 */
        .navi-search-modal, .video-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0,0,0,0.92);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 16px;
            justify-content: center;
            align-items: center;
        }

        .search-card, .video-modal-card {
            background-color: #1e293b;
            border-radius: 16px;
            padding: 20px;
            width: 92%;
            max-width: 500px;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-input-group {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            background-color: #0f172a;
            border: 1px solid #38bdf8;
            color: #fff;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
        }

        .search-btn {
            background-color: #0284c7;
            color: #fff;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-results {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .search-item {
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            border: 1px solid #334155;
        }
    </style>
</head>
<body>

    <div class="mobile-viewport" id="mobileViewport">
        <!-- 🚨 0.1초 반응 삐뽀삐뽀 화면 비상 경고등 -->
        <div id="emergencySirenOverlay" class="siren-overlay"></div>

        <!-- 모바일 후면 카메라 비디오 -->
        <video id="cameraVideo" autoplay playsinline muted style="display: none;"></video>

        <!-- 상단 HUD -->
        <div class="top-hud">
            <div class="hud-left">
                <div id="recPill" class="rec-pill">
                    <span style="width: 5px; height: 5px; background: white; border-radius: 50%;"></span>
                    REC (<span id="recCount">0</span>/2)
                </div>
                <div id="adasBadge" class="adas-status">⚪ ADAS 대기 중</div>
                <div class="cam-alert-pill">📷 단속 알림 ON</div>
            </div>

            <!-- 현재 GPS 차속 -->
            <div class="speed-display">
                <span id="speedNum">0</span>
                <span class="speed-unit">km/h</span>
            </div>

            <!-- 우측 신호등 감지 배지 -->
            <div class="traffic-badge">
                <div id="lightDot" class="light-dot green"></div>
                <span id="lightText">신호 스캔 중</span>
            </div>
        </div>

        <!-- 단속 카메라 알림 배너 -->
        <div id="cameraPopBanner" class="camera-pop-banner">📷 단속 카메라 주의 구간</div>

        <!-- 🗺️ 모바일 턴바이턴 배너 -->
        <div id="naviTurnBanner" class="navi-turn-banner">
            <div id="turnIcon" class="turn-icon">↗</div>
            <div class="turn-info">
                <div id="turnDist" class="turn-dist">300m</div>
                <div id="turnText" class="turn-text">잠시 후 우회전입니다</div>
            </div>
        </div>

        <!-- 🗺️ 모바일 GPS 지형 미니맵 -->
        <div id="naviMapContainer" class="navi-minimap-container">
            <div id="naviMap"></div>
        </div>

        <!-- 신호 변경 대형 팝업 배너 -->
        <div id="signalPopBanner" class="signal-pop-banner"></div>

        <!-- 중앙 비상 경보 팝업 -->
        <div id="alertBanner" class="alert-banner">위험 경보 메시지</div>

        <!-- 메인 카메라 & ADAS 오버레이 캔버스 -->
        <canvas id="adasCanvas"></canvas>

        <!-- 📱 모바일 드래그 제어 메뉴 바 -->
        <div id="draggableMenu" class="compact-menu-bar">
            <div class="drag-handle" id="dragHandle">⋮⋮ 드래그</div>
            <button id="btnPowerToggle" class="mini-btn power-btn-off">⚡ ADAS 켜기 (ON)</button>
            <button id="btnNaviToggle" class="mini-btn navi-btn-off">🗺️ 내비 OFF</button>
            <button id="btnFullScreen" class="mini-btn" style="background-color: #059669;">⛶ 꽉 찬 화면</button>
            <button id="btnPlayRecordings" class="mini-btn play-btn">📁 블랙박스</button>
            <button id="btnExitApp" class="mini-btn" style="background-color: #dc2626; color: #ffffff; font-weight: 900; box-shadow: 0 0 8px rgba(220, 38, 38, 0.7);">❌ 프로그램 종료</button>
            <button id="btnHideMenu" class="mini-btn hide-btn">🙈 접기</button>
        </div>

        <!-- 목적지 검색 모달 -->
        <div id="naviSearchModal" class="navi-search-modal">
            <div class="search-card">
                <div style="display: flex; justify-content: space-between; align-items: center; color: #38bdf8; font-weight: bold;">
                    <span>🗺️ 실시간 경로 길안내 (목적지 검색)</span>
                    <button id="btnCloseNaviModal" style="background: none; border: none; color: #fff; font-size: 1.3rem; cursor: pointer;">✕</button>
                </div>
                <div class="search-input-group">
                    <input type="text" id="destInput" class="search-input" placeholder="목적지 검색 (예: 서울역, 강남역, 인천공항)" value="서울역">
                    <button id="btnSearchDest" class="search-btn">검색</button>
                </div>
                <div id="searchResults" class="search-results">
                    <div class="search-item" onclick="selectQuickDest(37.5559, 126.9723, '서울역')">📍 <b>서울역</b> (서울특별시 용산구 한강대로 405)</div>
                    <div class="search-item" onclick="selectQuickDest(37.4979, 127.0276, '강남역')">📍 <b>강남역</b> (서울특별시 강남구 강남대로 396)</div>
                    <div class="search-item" onclick="selectQuickDest(37.4602, 126.4407, '인천국제공항')">📍 <b>인천국제공항</b> (인천광역시 중구 공항로 272)</div>
                </div>
            </div>
        </div>

        <!-- 블랙박스 저장 영상 모달 -->
        <div id="videoModal" class="video-modal">
            <div class="video-modal-card">
                <div style="font-size: 0.95rem; font-weight: bold; color: #ec4899; display: flex; justify-content: space-between; align-items: center;">
                    <span>⏺️ 블랙박스 저장 영상 (최대 2개 순환)</span>
                    <button id="btnCloseModal" style="background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer;">✕</button>
                </div>
                <div style="width:100%; height:180px; background:#000; border-radius:6px; overflow:hidden;">
                    <video id="blackboxPlayer" controls autoplay style="width:100%; height:100%; object-fit:contain;"></video>
                </div>
                <div id="videoListContainer" style="display:flex; flex-direction:column; gap:6px; max-height:180px; overflow-y:auto;">
                    <div style="color: #94a3b8; font-size: 0.8rem; text-align: center; padding: 8px;">녹화된 영상이 아직 없습니다.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 모바일 자동 캐시 세척
        if ('caches' in window) {
            caches.keys().then(function(names) { for (let name of names) caches.delete(name); });
        }

        // -------------------------------------------------------------
        // 💡 모바일 운전 중 화면 꺼짐 100% 방지 (HTML5 Screen Wake Lock)
        // -------------------------------------------------------------
        let wakeLock = null;
        async function requestScreenWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }

        // -------------------------------------------------------------
        // 📳 모바일 햅틱 진동 피드백
        // -------------------------------------------------------------
        function triggerHaptic(duration = 25) {
            if ('vibrate' in navigator) {
                navigator.vibrate(duration);
            }
        }

        const canvas = document.getElementById('adasCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('cameraVideo');
        const adasBadge = document.getElementById('adasBadge');
        const mobileViewport = document.getElementById('mobileViewport');
        const speedNum = document.getElementById('speedNum');
        const recCount = document.getElementById('recCount');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);
        resizeCanvas();

        // -------------------------------------------------------------
        // 🖐️ 모바일 드래그 핸들 전용 드래그
        // -------------------------------------------------------------
        const draggableMenu = document.getElementById('draggableMenu');
        const dragHandle = document.getElementById('dragHandle');
        const btnHideMenu = document.getElementById('btnHideMenu');

        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        function startDrag(e) {
            isDragging = true;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const rect = draggableMenu.getBoundingClientRect();
            startX = clientX;
            startY = clientY;
            initialLeft = rect.left;
            initialTop = rect.top;

            draggableMenu.style.transform = 'none';
            draggableMenu.style.left = initialLeft + 'px';
            draggableMenu.style.top = initialTop + 'px';
            draggableMenu.style.bottom = 'auto';
        }

        function moveDrag(e) {
            if (!isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const deltaX = clientX - startX;
            const deltaY = clientY - startY;

            let newLeft = initialLeft + deltaX;
            let newTop = initialTop + deltaY;

            newLeft = Math.max(5, Math.min(window.innerWidth - draggableMenu.offsetWidth - 5, newLeft));
            newTop = Math.max(5, Math.min(window.innerHeight - draggableMenu.offsetHeight - 5, newTop));

            draggableMenu.style.left = newLeft + 'px';
            draggableMenu.style.top = newTop + 'px';
        }

        function stopDrag() { isDragging = false; }

        dragHandle.addEventListener('touchstart', startDrag, { passive: true });

                if (json.routes && json.routes.length > 0) {

        // -------------------------------------------------------------

        // -------------------------------------------------------------
        let mediaRecorder = null;
        let recordedChunks = [];
        let storedRecordings = [];
        let recordingInterval = null;

        function initBlackboxRecorder(stream) {
            if (!window.MediaRecorder) return;
            try {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });
            } catch (e) {
                try { mediaRecorder = new MediaRecorder(stream); } catch (e2) { return; }
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) recordedChunks.push(event.data);
            };

            mediaRecorder.onstop = () => {
                const blob = new Blob(recordedChunks, { type: 'video/mp4' });
                recordedChunks = [];
                const blobUrl = URL.createObjectURL(blob);
                const timestamp = new Date().toLocaleTimeString('ko-KR');

                if (storedRecordings.length >= 2) {
                    const oldest = storedRecordings.shift();
                    URL.revokeObjectURL(oldest.blobUrl);
                }

                storedRecordings.push({ id: Date.now(), time: timestamp, blobUrl: blobUrl, blob: blob });
                recCount.innerText = storedRecordings.length;
            };

            mediaRecorder.start();

            if (recordingInterval) clearInterval(recordingInterval);
            recordingInterval = setInterval(() => {
                if (mediaRecorder && mediaRecorder.state === 'recording') {
                    mediaRecorder.stop();
                    mediaRecorder.start();
                }
            }, 60000);
        }

        function stopBlackboxRecorder() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
            if (recordingInterval) clearInterval(recordingInterval);
        }

        // -------------------------------------------------------------
        let sirenOverlayTimer = null;

        function triggerEmergencySirenOverlay(durationMs = 1800) {
            const overlay = document.getElementById('emergencySirenOverlay');
            if (!overlay) return;
            overlay.style.display = 'block';
            triggerHaptic(120);
            playSirenPolice(0.4);

            if (sirenOverlayTimer) clearTimeout(sirenOverlayTimer);
            sirenOverlayTimer = setTimeout(() => {
                overlay.style.display = 'none';
            }, durationMs);
        }

        function playSirenPolice(duration = 0.4) {
            initAudio();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                const now = audioCtx.currentTime;
                osc.frequency.setValueAtTime(950, now);
                osc.frequency.linearRampToValueAtTime(550, now + duration);
                gain.gain.setValueAtTime(0.6, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(now + duration);
            } catch (e) {}
        }

        let lastVoiceTime = 0;

        // -------------------------------------------------------------
        // ⚡ 0.1초 실시간 신호등 픽셀 초고속 스캔 엔진
        // -------------------------------------------------------------
        // -------------------------------------------------------------
        // ⚡ 0.1초 실시간 신호등 픽셀 클러스터 정밀 스캔 엔진
        // -------------------------------------------------------------
        let lastAutoSignalState = 'GREEN';
        let pendingSignalState = null;
        let pendingSignalCount = 0;

        function analyzeCameraFramePixels(frameCtx, width, height) {
            if (!programRunning) return;

            // 신호등 핵심 영역: 상단 5% ~ 35%, 좌우 15% ~ 85%
            const startY = Math.floor(height * 0.05);
            const scanHeight = Math.floor(height * 0.30);
            const startX = Math.floor(width * 0.15);
            const scanWidth = Math.floor(width * 0.70);

            let frameData;
            try {
                frameData = frameCtx.getImageData(startX, startY, scanWidth, scanHeight);
            } catch (e) { return; }

            const data = frameData.data;
            let redClusterCount = 0;
            let greenClusterCount = 0;

            for (let i = 0; i < data.length; i += 12) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const sum = r + g + b + 1;

                const rNorm = r / sum;
                const gNorm = g / sum;
                const luminance = 0.299 * r + 0.587 * g + 0.114 * b;

                // 정규화 색도 & 광도 + 색상 대비 조건 (가짜 붉은색 오탐 차단)
                if (rNorm > 0.52 && r > 165 && g < 120 && b < 120 && luminance > 90) {
                    redClusterCount++;
                } else if (gNorm > 0.44 && g > 155 && r < 135 && b > 90 && luminance > 90) {
                    greenClusterCount++;
                }
            }

            const lightDot = document.getElementById('lightDot');
            const lightText = document.getElementById('lightText');

            // 20개 이상 밀집 픽셀(Cluster) 존재 시 신호 판정
            let detectedState = null;
            if (redClusterCount >= 20) {
                detectedState = 'RED';
            } else if (greenClusterCount >= 20) {
                detectedState = 'GREEN';
            }

            if (detectedState && detectedState !== lastAutoSignalState) {
                if (pendingSignalState === detectedState) {
                    pendingSignalCount++;
                } else {
                    pendingSignalState = detectedState;
                    pendingSignalCount = 1;
                }

                // 2회 연속 프레임(약 0.06초) 확인 후 즉시 판정 (0.1초 이내 확정)
                if (pendingSignalCount >= 2) {
                    lastAutoSignalState = detectedState;
                    pendingSignalCount = 0;

                    if (lastAutoSignalState === 'RED') {
                        lightDot.className = 'light-dot red';
                        lightText.innerText = '적색 정지 신호';
                        triggerEmergencySirenOverlay(2000);
                        speakVoiceFast("위험! 적색 정지 신호! 차를 멈추세요!", true);
                    } else if (lastAutoSignalState === 'GREEN') {
                        lightDot.className = 'light-dot green';
                        lightText.innerText = '파란 신호';
                        const overlay = document.getElementById('emergencySirenOverlay');
                        if (overlay) overlay.style.display = 'none';
                        speakVoiceFast("파란 신호입니다. 출발하세요.", true);
                    }
                }
            } else {
                pendingSignalCount = 0;
            }
        }

        // -------------------------------------------------------------
        // 🚘 실시간 동적 광학 모션 충돌 감지 (Optical FCW)
        // -------------------------------------------------------------
        let prevFrameBuffer = null;
        let lastFcwAlertTime = 0;

        function analyzeOpticalMotion(frameCtx, width, height) {
            if (!programRunning) return;

            // 중앙 전방 차선 영역 (x: 35%~65%, y: 40%~75%)
            const cX = Math.floor(width * 0.35);
            const cY = Math.floor(height * 0.40);
            const cW = Math.floor(width * 0.30);
            const cH = Math.floor(height * 0.35);

            let imgData;
            try {
                imgData = frameCtx.getImageData(cX, cY, cW, cH);
            } catch (e) { return; }

            const currData = imgData.data;
            if (prevFrameBuffer && prevFrameBuffer.length === currData.length) {
                let diffSum = 0;
                let totalSampled = 0;

                for (let i = 0; i < currData.length; i += 16) {
                    const diffR = Math.abs(currData[i] - prevFrameBuffer[i]);
                    const diffG = Math.abs(currData[i + 1] - prevFrameBuffer[i + 1]);
                    const diffB = Math.abs(currData[i + 2] - prevFrameBuffer[i + 2]);
                    diffSum += (diffR + diffG + diffB);
                    totalSampled++;
                }

                const avgMotion = diffSum / (totalSampled * 3);

                // 급격한 광학 변동 (전방 차량 급정거 / 접근) 시 거리 감소
                if (avgMotion > 28.0) {
                    vehicleDistance = Math.max(6.0, vehicleDistance - 3.8);
                } else if (avgMotion < 12.0) {
                    vehicleDistance = Math.min(28.0, vehicleDistance + 0.8);
                }

                // 충돌 임계치 (15m 이내) 진입 시 즉시 0.1초 비상등 + 음성 알림
                if (vehicleDistance < 15.0) {
                    const currentTimeMs = Date.now();
                    if (currentTimeMs - lastFcwAlertTime > 2500) {
                        lastFcwAlertTime = currentTimeMs;
                        triggerEmergencySirenOverlay(1600);
                        speakVoiceFast("위험! 전방 차량 충돌 위험! 즉시 감속하세요!", true);
                    }
                }
            }

            prevFrameBuffer = new Uint8ClampedArray(currData);
        }

        // -------------------------------------------------------------
        // 메인 렌더링 루프 (0.1초 초고속 반응)
        // -------------------------------------------------------------
        let lastFrameTime = performance.now();
        let frameScanCounter = 0;
        let vehicleDistance = 22.0;

        function renderLoop() {
            const now = performance.now();
            const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
            lastFrameTime = now;

            const vpX = canvas.width / 2;
            const vpY = canvas.height * 0.45;

            if (programRunning && video.readyState === 4) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                frameScanCounter++;
                // 매 2프레임마다(약 0.03초) 신호등 픽셀 클러스터 분석
                if (frameScanCounter % 2 === 0) {
                    try { analyzeCameraFramePixels(ctx, canvas.width, canvas.height); } catch (e) {}
                }
                // 매 3프레임마다(약 0.05초) 광학 모션 전방 충돌 분석
                if (frameScanCounter % 3 === 0) {
                    try { analyzeOpticalMotion(ctx, canvas.width, canvas.height); } catch (e) {}
                }
            } else {
                ctx.fillStyle = '#050b14';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.moveTo(vpX - 15, vpY);
                ctx.lineTo(vpX + 15, vpY);
                ctx.lineTo(canvas.width * 0.95, canvas.height);
                ctx.lineTo(canvas.width * 0.05, canvas.height);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = Math.max(2, canvas.width * 0.004);
                ctx.setLineDash([15, 15]);
                ctx.lineDashOffset = -now * 0.04 * (Math.max(30, egoSpeed) / 60);
                ctx.beginPath();
                ctx.moveTo(vpX, vpY);
                ctx.lineTo(canvas.width / 2, canvas.height);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            if (programRunning) {
                const boxHeight = Math.max(35, (canvas.height * 1.2) / vehicleDistance);
                const boxWidth = boxHeight * 1.2;
                const carY = vpY + (canvas.height - vpY) * (1.0 - (vehicleDistance / 50.0));
                const carX = vpX - boxWidth / 2;

                const isDanger = vehicleDistance < 15.0;
                ctx.strokeStyle = isDanger ? '#ef4444' : '#22c55e';
                ctx.lineWidth = isDanger ? 5 : 3;
                ctx.strokeRect(carX, carY - boxHeight, boxWidth, boxHeight);

                ctx.fillStyle = isDanger ? '#ef4444' : '#22c55e';
                ctx.fillRect(carX, carY - boxHeight - 20, boxWidth, 20);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText(`AHEAD VEHICLE | ${vehicleDistance.toFixed(1)}m`, carX + 4, carY - boxHeight - 5);
            }

            requestAnimationFrame(renderLoop);
        }

        requestAnimationFrame(renderLoop);
    </script>
</body>
</html>
