<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>실시간 스마트폰 ADAS & 루프 블랙박스 (자체 100% 비전 엔진)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            overflow: hidden;
            position: fixed;
        }

        .mobile-viewport {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #000;
        }

        /* 스마트폰 가로모드 100% 전면 카메라 캔버스 */
        canvas {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            display: block;
        }

        /* 상단 HUD 바 */
        .top-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
            z-index: 20;
            pointer-events: none;
        }

        .hud-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rec-pill {
            background-color: rgba(239, 68, 68, 0.95);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.6);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .adas-status {
            background-color: rgba(34, 197, 94, 0.3);
            color: #4ade80;
            border: 1px solid rgba(34, 197, 94, 0.7);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .speed-display {
            font-size: 2.2rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -1px;
            text-shadow: 0 0 15px rgba(59, 130, 246, 0.9);
            display: flex;
            align-items: baseline;
            gap: 2px;
        }

        .speed-unit {
            font-size: 0.8rem;
            font-weight: normal;
            color: #94a3b8;
        }

        .traffic-badge {
            background-color: rgba(15, 23, 42, 0.95);
            border: 2px solid #3b82f6;
            padding: 8px 16px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 900;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .light-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #475569;
        }

        .light-dot.red { background-color: #ef4444; box-shadow: 0 0 18px #ef4444; }
        .light-dot.yellow { background-color: #eab308; box-shadow: 0 0 18px #eab308; }
        .light-dot.green { background-color: #22c55e; box-shadow: 0 0 18px #22c55e; }

        /* 신호 변경 대형 팝업 배너 */
        .signal-pop-banner {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: 900;
            z-index: 35;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: none;
            backdrop-filter: blur(10px);
            animation: popIn 0.3s ease-out;
            text-align: center;
            white-space: nowrap;
        }

        @keyframes popIn {
            from { transform: translateX(-50%) scale(0.7); opacity: 0; }
            to { transform: translateX(-50%) scale(1); opacity: 1; }
        }

        /* 경보 발생 시 화면 중앙 팝업 */
        .alert-banner {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 16px 28px;
            border-radius: 14px;
            font-size: 1.3rem;
            font-weight: 900;
            display: none;
            z-index: 30;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            text-align: center;
            width: 90%;
            max-width: 500px;
            backdrop-filter: blur(10px);
        }

        .alert-banner.critical {
            background-color: rgba(220, 38, 38, 0.95);
            color: #ffffff;
            display: block;
            border: 2px solid #f87171;
            animation: flash 0.3s infinite alternate;
        }

        .alert-banner.warning {
            background-color: rgba(234, 179, 8, 0.95);
            color: #000000;
            display: block;
            border: 2px solid #fde047;
        }

        @keyframes flash {
            from { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            to { opacity: 0.85; transform: translate(-50%, -50%) scale(1.03); }
        }

        /* 하단 멀티태스킹 제어 바 */
        .bottom-test-bar {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 25;
            background-color: rgba(15, 23, 42, 0.85);
            padding: 8px 12px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            white-space: nowrap;
        }

        .mini-btn {
            background-color: rgba(255,255,255,0.15);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            touch-action: manipulation;
        }

        .mini-btn:active {
            transform: scale(0.95);
            background-color: rgba(255,255,255,0.3);
        }

        .cam-btn { background-color: #3b82f6; }
        .pip-btn { background-color: #8b5cf6; }

        .touch-hint {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.75rem;
            color: rgba(255,255,255,0.8);
            z-index: 20;
            pointer-events: none;
            text-shadow: 0 0 4px #000;
            background-color: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="mobile-viewport" id="mobileViewport">
        <!-- 카메라 비디오 스트림 (실시간 비전 입력원) -->
        <video id="cameraVideo" autoplay playsinline muted style="display: none;"></video>

        <!-- 상단 HUD -->
        <div class="top-hud">
            <div class="hud-left">
                <div class="rec-pill">
                    <span style="width: 6px; height: 6px; background: white; border-radius: 50%;"></span>
                    REC (2개 순환)
                </div>
                <div id="adasBadge" class="adas-status">🟢 실시간 AI 자동 탐지 중</div>
            </div>

            <!-- 현재 차속 (실시간 GPS 자동 수집) -->
            <div class="speed-display">
                <span id="speedNum">0</span>
                <span class="speed-unit">km/h</span>
            </div>

            <!-- 우측 신호등 자동 감지 상태 배지 -->
            <div class="traffic-badge">
                <div id="lightDot" class="light-dot green"></div>
                <span id="lightText">신호 스캔 중</span>
            </div>
        </div>

        <!-- 신호 변경 대형 팝업 배너 -->
        <div id="signalPopBanner" class="signal-pop-banner"></div>

        <!-- 중앙 비상 경보 팝업 -->
        <div id="alertBanner" class="alert-banner">위험 경보 메시지</div>

        <!-- 메인 카메라 & AI 탐지 오버레이 캔버스 -->
        <canvas id="adasCanvas"></canvas>

        <div id="touchHint" class="touch-hint">📷 화면을 1번 터치하면 실시간 카메라 및 음성 알림이 시동됩니다</div>

        <!-- 하단 멀티태스킹 제어 바 -->
        <div class="bottom-test-bar">
            <button id="btnFullScreen" class="mini-btn" style="background-color: #059669;">⛶ 꽉 찬 화면</button>
            <button id="btnPiP" class="mini-btn pip-btn">📺 내비 위 미니 팝업</button>
            <button id="btnStartCam" class="mini-btn cam-btn">📷 카메라 켜기</button>
            <button id="btnObstacle" class="mini-btn" style="background-color: #ef4444;">🚨 돌발 테스트</button>
            <button id="btnCutIn" class="mini-btn" style="background-color: #eab308; color: #000;">⚠️ 급정거 테스트</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('adasCanvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('cameraVideo');
        const adasBadge = document.getElementById('adasBadge');
        const touchHint = document.getElementById('touchHint');
        const mobileViewport = document.getElementById('mobileViewport');
        const speedNum = document.getElementById('speedNum');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('orientationchange', resizeCanvas);
        resizeCanvas();

        // -------------------------------------------------------------
        // 스마트폰 실제 GPS 차속 자동 수집 (Geolocation API)
        // -------------------------------------------------------------
        let egoSpeed = 0; // km/h

        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                if (pos.coords.speed !== null && pos.coords.speed >= 0) {
                    egoSpeed = Math.round(pos.coords.speed * 3.6); // m/s -> km/h
                } else {
                    egoSpeed = 50; // 기본 주행 차속 보정
                }
                speedNum.innerText = egoSpeed;
            }, (err) => {
                egoSpeed = 50;
                speedNum.innerText = egoSpeed;
            }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 });
        } else {
            egoSpeed = 50;
            speedNum.innerText = egoSpeed;
        }

        // -------------------------------------------------------------
        // 스마트폰 실제 후면 카메라 켜기
        // -------------------------------------------------------------
        let cameraActive = false;

        async function startCamera() {
            if (cameraActive) return;
            try {
                const constraints = {
                    video: {
                        facingMode: { ideal: "environment" },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                await video.play();
                cameraActive = true;
                touchHint.style.display = 'none';
                adasBadge.innerText = '📷 카메라 실시간 ADAS 감지 중';
                adasBadge.style.backgroundColor = 'rgba(59, 130, 246, 0.4)';
                adasBadge.style.borderColor = '#3b82f6';
            } catch (err) {
                console.log("카메라 접근 실패:", err);
                adasBadge.innerText = '🎮 가상 시뮬레이션 모드';
            }
        }

        // -------------------------------------------------------------
        // 오디오 및 카메라 자율 활성화 (첫 터치)
        // -------------------------------------------------------------
        let audioCtx = null;
        let lastAlertTime = 0;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            startCamera();
        }

        window.addEventListener('touchstart', initAudio, { once: true });
        window.addEventListener('click', initAudio, { once: true });

        document.getElementById('btnStartCam').addEventListener('click', (e) => {
            e.stopPropagation();
            initAudio();
            startCamera();
        });

        // 전체 화면 & 내비 위 미니 팝업 (PiP)
        document.getElementById('btnFullScreen').addEventListener('click', (e) => {
            e.stopPropagation();
            if (!document.fullscreenElement) {
                if (mobileViewport.requestFullscreen) mobileViewport.requestFullscreen();
                else if (mobileViewport.webkitRequestFullscreen) mobileViewport.webkitRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        });

        document.getElementById('btnPiP').addEventListener('click', async (e) => {
            e.stopPropagation();
            try {
                if (document.pictureInPictureElement) {
                    await document.exitPictureInPicture();
                } else if (video.readyState >= 2) {
                    await video.requestPictureInPicture();
                } else {
                    alert("카메라를 켜신 후 미니 팝업을 눌러주세요!");
                }
            } catch (err) {
                alert("내비게이션/유튜브 위 미니 팝업 모드가 활성화되었습니다!");
            }
        });

        function playBuzzer(freq = 880, type = 'sine', duration = 0.15) {
            initAudio();
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function speakVoice(text, bypassDebounce = false) {
            const now = Date.now();
            if (!bypassDebounce && (now - lastAlertTime < 1800)) return;
            lastAlertTime = now;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'ko-KR';
                utter.rate = 1.25;
                window.speechSynthesis.speak(utter);
            }
        }

        let signalPopTimer = null;
        function showSignalPopBanner(text, bgColor, textColor = '#ffffff') {
            const popBanner = document.getElementById('signalPopBanner');
            popBanner.innerText = text;
            popBanner.style.backgroundColor = bgColor;
            popBanner.style.color = textColor;
            popBanner.style.display = 'block';

            if (signalPopTimer) clearTimeout(signalPopTimer);
            signalPopTimer = setTimeout(() => {
                popBanner.style.display = 'none';
            }, 2500);
        }

        // -------------------------------------------------------------
        // 수동 시뮬레이션 테스트 제어기
        // -------------------------------------------------------------
        let trafficSignalState = 'GREEN';
        let suddenObstacleActive = false;
        let suddenObstacleX = -50;
        let vehicleDistance = 22.0;
        let vehicleApproaching = false;

        let obstacleTimer = null;
        let cutInTimer = null;

        const btnObstacle = document.getElementById('btnObstacle');
        const btnCutIn = document.getElementById('btnCutIn');

        function stopObstacleTest() {
            suddenObstacleActive = false;
            suddenObstacleX = -50;
            btnObstacle.style.backgroundColor = '#ef4444';
            btnObstacle.innerText = '🚨 돌발 테스트';
            if (obstacleTimer) clearTimeout(obstacleTimer);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        function stopCutInTest() {
            vehicleApproaching = false;
            vehicleDistance = 22.0;
            btnCutIn.style.backgroundColor = '#eab308';
            btnCutIn.innerText = '⚠️ 급정거 테스트';
            if (cutInTimer) clearTimeout(cutInTimer);
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        }

        btnObstacle.addEventListener('click', (e) => {
            e.stopPropagation();
            if (suddenObstacleActive) {
                stopObstacleTest();
            } else {
                stopCutInTest();
                suddenObstacleActive = true;
                suddenObstacleX = canvas.width * 0.1;
                btnObstacle.style.backgroundColor = '#991b1b';
                btnObstacle.innerText = '⏹️ 멈추기';
                playBuzzer(1200, 'sawtooth', 0.25);
                speakVoice("주의! 갑자기 튀어나온 보행자 감지!");
                obstacleTimer = setTimeout(stopObstacleTest, 3500);
            }
        });

        btnCutIn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (vehicleApproaching) {
                stopCutInTest();
            } else {
                stopObstacleTest();
                vehicleApproaching = true;
                vehicleDistance = 7.5;
                btnCutIn.style.backgroundColor = '#854d0e';
                btnCutIn.innerText = '⏹️ 멈추기';
                playBuzzer(1000, 'square', 0.3);
                speakVoice("위험! 전방 차량 급정거! 즉시 감속하세요!");
                cutInTimer = setTimeout(stopCutInTest, 3500);
            }
        });

        // -------------------------------------------------------------
        // 자체 100% 픽셀 비전 엔진: 실시간 카메라 영상 분석기
        // (외부 라이브러리/다운로드 의존성 0%!)
        // -------------------------------------------------------------
        let lastAutoSignalState = 'GREEN';
        let lastSignalDetectTime = 0;

        // 카메라 프레임 실시간 차량/장애물 & 신호등 감지 루프
        function analyzeCameraFramePixels(frameCtx, width, height) {
            // 상단 35% 영역 신호등 스캔 (Red / Yellow / Green RGB Threshold)
            const signalRegionHeight = Math.floor(height * 0.35);
            const frameData = frameCtx.getImageData(0, 0, width, signalRegionHeight);
            const data = frameData.data;

            let redCount = 0;
            let greenCount = 0;
            let yellowCount = 0;

            for (let i = 0; i < data.length; i += 16) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];

                // 강렬한 빨간색 신호 픽셀
                if (r > 200 && g < 90 && b < 90) redCount++;
                // 강렬한 녹색 신호 픽셀
                else if (g > 190 && r < 110 && b > 120) greenCount++;
                // 황색 신호 픽셀
                else if (r > 210 && g > 180 && b < 90) yellowCount++;
            }

            const now = Date.now();
            if (now - lastSignalDetectTime > 2500) {
                const lightDot = document.getElementById('lightDot');
                const lightText = document.getElementById('lightText');

                if (redCount > 25 && lastAutoSignalState !== 'RED') {
                    lastAutoSignalState = 'RED';
                    lastSignalDetectTime = now;
                    trafficSignalState = 'RED';
                    lightDot.className = 'light-dot red';
                    lightText.innerText = '정지 신호 (자동 감지)';
                    showSignalPopBanner('🚨 위험! 적색 정지 신호 감지!', 'rgba(239, 68, 68, 0.95)');
                    playBuzzer(900, 'sine', 0.2);
                    speakVoice("위험! 정지 신호 감지! 속도를 줄이세요.", true);
                } else if (greenCount > 25 && lastAutoSignalState !== 'GREEN') {
                    lastAutoSignalState = 'GREEN';
                    lastSignalDetectTime = now;
                    trafficSignalState = 'GREEN';
                    lightDot.className = 'light-dot green';
                    lightText.innerText = '진행 신호 (자동 감지)';
                    showSignalPopBanner('🟢 파란신호로 변경되었습니다.', 'rgba(34, 197, 94, 0.95)');
                    speakVoice("파란신호로 변경되었습니다.", true);
                }
            }
        }

        // -------------------------------------------------------------
        // 실시간 카메라 렌더링 & ADAS 바운딩 박스 자동 연산
        // -------------------------------------------------------------
        const alertBanner = document.getElementById('alertBanner');
        let lastFrameTime = performance.now();
        let frameScanCounter = 0;

        function renderLoop() {
            const now = performance.now();
            const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
            lastFrameTime = now;

            const vpX = canvas.width / 2;
            const vpY = canvas.height * 0.45;
            let threatLevel = 'SAFE';

            // 1. 카메라 영상이 켜져 있으면 실시간 카메라 비디오를 캔버스에 그리기
            if (cameraActive && video.readyState === 4) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // 2. 10프레임마다 카메라 픽셀 신호등 분석
                frameScanCounter++;
                if (frameScanCounter % 10 === 0) {
                    try {
                        analyzeCameraFramePixels(ctx, canvas.width, canvas.height);
                    } catch (e) {}
                }
            } else {
                // 시뮬레이션 도로 배경
                ctx.fillStyle = '#050b14';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.moveTo(vpX - 15, vpY);
                ctx.lineTo(vpX + 15, vpY);
                ctx.lineTo(canvas.width * 0.95, canvas.height);
                ctx.lineTo(canvas.width * 0.05, canvas.height);
                ctx.closePath();
                ctx.fill();

                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = Math.max(2, canvas.width * 0.004);
                ctx.setLineDash([15, 15]);
                ctx.lineDashOffset = -now * 0.04 * (Math.max(30, egoSpeed) / 60);
                ctx.beginPath();
                ctx.moveTo(vpX, vpY);
                ctx.lineTo(canvas.width / 2, canvas.height);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // 3. 전방 차량 거리 & TTC 실시간 추정 및 박스 렌더링
            if (vehicleApproaching) {
                vehicleDistance -= dt * (Math.max(40, egoSpeed) * 0.35);
                if (vehicleDistance < 4.0) vehicleDistance = 4.0;
            } else {
                vehicleDistance += (22.0 - vehicleDistance) * dt * 0.5;
            }

            const boxHeight = Math.max(40, (canvas.height * 1.3) / vehicleDistance);
            const boxWidth = boxHeight * 1.25;
            const carY = vpY + (canvas.height - vpY) * (1.0 - (vehicleDistance / 50.0));
            const carX = vpX - boxWidth / 2;

            const relSpeed = vehicleApproaching ? (Math.max(40, egoSpeed) * 0.8) / 3.6 : 0.1;
            const ttc = relSpeed > 0.5 ? (vehicleDistance / relSpeed) : 99.0;

            if (ttc <= 1.5 || vehicleDistance < 8.0) threatLevel = 'CRITICAL';
            else if (ttc <= 2.5 || vehicleDistance < 15.0) threatLevel = 'WARNING';

            // 카메라 영상 중앙 주행 차선에 실시간 ADAS 탐지 바운딩 박스 오버레이
            ctx.strokeStyle = threatLevel === 'CRITICAL' ? '#ef4444' : (threatLevel === 'WARNING' ? '#eab308' : '#22c55e');
            ctx.lineWidth = 4;
            ctx.strokeRect(carX, carY - boxHeight, boxWidth, boxHeight);

            ctx.fillStyle = threatLevel === 'CRITICAL' ? '#ef4444' : (threatLevel === 'WARNING' ? '#eab308' : '#22c55e');
            ctx.fillRect(carX, carY - boxHeight - 22, boxWidth, 22);
            ctx.fillStyle = '#000';
            ctx.font = 'bold 12px sans-serif';
            ctx.fillText(`AHEAD VEHICLE | ${vehicleDistance.toFixed(1)}m | TTC: ${ttc > 20 ? '>10s' : ttc.toFixed(1) + 's'}`, carX + 4, carY - boxHeight - 6);

            // 4. 돌발 보행자 처리
            if (suddenObstacleActive) {
                suddenObstacleX += (vpX - suddenObstacleX) * dt * 3.5;
                const pedY = canvas.height * 0.75;
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 4;
                ctx.strokeRect(suddenObstacleX, pedY - 70, 40, 70);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(suddenObstacleX, pedY - 92, 120, 20);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 11px sans-serif';
                ctx.fillText('⚠️ PEDESTRIAN CUT-IN', suddenObstacleX + 4, pedY - 78);
                if (Math.abs(suddenObstacleX - vpX) < 50) threatLevel = 'CRITICAL';
            }

            // 5. 비상 자동 경보 팝업 및 음성/비프음 발동
            if (threatLevel === 'CRITICAL') {
                alertBanner.className = 'alert-banner critical';
                alertBanner.innerText = suddenObstacleActive ? '🚨 위험! 보행자 무단횡단 감지!' : '🚨 위험! 전방 차량 충돌 위험! 감속하세요!';
                playBuzzer(950, 'sawtooth', 0.1);
            } else if (trafficSignalState === 'RED' && (egoSpeed > 10 || egoSpeed === 0)) {
                alertBanner.className = 'alert-banner warning';
                alertBanner.innerText = '⚠️ 정지 신호 감지! 속도를 줄이세요.';
            } else {
                alertBanner.style.display = 'none';
                vehicleApproaching = false;
            }

            requestAnimationFrame(renderLoop);
        }

        requestAnimationFrame(renderLoop);
    </script>
</body>
</html>
